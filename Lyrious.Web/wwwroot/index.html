<!DOCTYPE html>
<html>

<head>
    <title>Lyrious</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Plain file names (no fingerprint placeholders): the SDK doesn't fill those in when the page
         is published through Lyrious.Api, which serves it. The server's ETags keep caches fresh. -->
    <script type='module' src="./main.js"></script>
    <!-- (Not "app.css": published under the base path app/, the SDK served that one at the root.) -->
    <link rel="stylesheet" href="./splash.css" />
    <!-- Installable as an app (PWA): the manifest, and main.js registers service-worker.js. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b2a4e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lyrious" />
</head>

<body style="margin: 0; overflow: hidden">
<!-- The login as a real form, out of sight, for the browser's own password manager (main.js,
     lyriousCredentials): it fills it in, and offers to save the login when it's submitted after
     logging in. It's submitted into the empty frame below, so nothing is sent anywhere. -->
<form id="lyrious-login" method="post" action="about:blank" target="lyrious-login-frame" autocomplete="on" aria-hidden="true"
      style="position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none">
    <input type="text" name="username" autocomplete="username" tabindex="-1">
    <input type="password" name="password" autocomplete="current-password" tabindex="-1">
    <button type="submit" tabindex="-1">Log in</button>
</form>
<iframe name="lyrious-login-frame" title="" aria-hidden="true" tabindex="-1" style="display: none"></iframe>
<div id="out">
    <!-- Shown while the app loads (Avalonia closes it by this class name). -->
    <div class="avalonia-splash">
        <div class="splash-content">
            <img class="splash-logo" src="./icons/singer.svg" alt="" />
            <h2>Lyrious</h2>
        </div>
    </div>
</div>

</body>

</html>
